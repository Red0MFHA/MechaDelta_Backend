services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mechadelta
      POSTGRES_PASSWORD: mechadelta
      POSTGRES_DB: mechadelta
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mechadelta -d mechadelta"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
